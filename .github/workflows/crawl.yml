# Crawl StreetEasy (NYC) and Zillow (northern Michigan) and push the listings
# to the housedeals Worker (POST /api/listings), then read the detail pages
# the Worker asks for (needs-detail) and push those too. Then score each
# market crawled here: the Worker only stores, so the job reads the rows back
# (GET /api/score-input), runs the scorer (scorer/, built below) and posts
# the scores and alerts (POST /api/scores).
#
# No schedule: the Worker's crons call workflow_dispatch (GitHub's schedule is
# unreliable at short intervals):
#   */30 * * * *  mode=quick  newest page of each search, <= 6 detail pages
#   0 11 * * *    mode=full   every page of each search, <= 20 detail pages
#   15 13 * * *   mode=sold   Michigan homes sold in the last 12 months, then NYC
#                             apartments sold in the last 6 months, a few borough
#                             price bands a day (Zillow, <= 25 requests 8 s apart)
#
# Setup (once, in the GitHub repo): Settings > Secrets and variables > Actions
#   Secrets   > HOUSEDEALS_INGEST_TOKEN = the Worker's INGEST_TOKEN
#   Variables > HOUSEDEALS_API_URL      = https://housedeals-api.<you>.workers.dev
# Until HOUSEDEALS_API_URL is set, runs are skipped (so forks stay quiet).
#
# Politeness: one job at a time (concurrency), one request at a time inside
# it, 1.5 s between requests (6 s between detail pages, 8 s between Zillow
# pages in sold mode), a normal browser User-Agent, and a source stops at its
# first error. Zillow answering 403 / 429 / a bot check ends the run's Zillow
# requests with a warning; the run still succeeds.
name: crawl

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick (newest page), full (every page) or sold (sold comps: Michigan, NYC)"
        type: choice
        options: [quick, full, sold]
        default: quick
        required: true

permissions:
  contents: read

# Never two crawls at once: a slow run makes the next one wait, not overlap.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: vars.HOUSEDEALS_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: crawler/go.mod
          cache: false # no dependencies, so no go.sum to key a cache on

      - name: Check configuration
        env:
          HOUSEDEALS_INGEST_TOKEN: ${{ secrets.HOUSEDEALS_INGEST_TOKEN }}
          HOUSEDEALS_API_URL: ${{ vars.HOUSEDEALS_API_URL }}
        run: |
          [ -n "$HOUSEDEALS_INGEST_TOKEN" ] || { echo "::error::repository secret HOUSEDEALS_INGEST_TOKEN is not set"; exit 1; }
          case "$HOUSEDEALS_API_URL" in https://*) ;; *) echo "::error::HOUSEDEALS_API_URL must start with https://"; exit 1;; esac

      - name: Build the crawler
        run: go build -trimpath -o "$RUNNER_TEMP/housedeals" ./cmd/housedeals

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scorer

      - name: Build the scorer
        working-directory: scorer
        run: |
          cargo build --release --locked --bin housedeals-score
          cp target/release/housedeals-score "$RUNNER_TEMP/housedeals-score"

      - name: Crawl and push
        env:
          HOUSEDEALS_INGEST_TOKEN: ${{ secrets.HOUSEDEALS_INGEST_TOKEN }}
          HOUSEDEALS_API_URL: ${{ vars.HOUSEDEALS_API_URL }}
          MODE: ${{ inputs.mode || 'quick' }}
        run: |
          case "$MODE" in quick|full|sold) ;; *) echo "::error::mode must be quick, full or sold"; exit 1;; esac
          "$RUNNER_TEMP/housedeals" --mode "$MODE" --market all --push "$HOUSEDEALS_API_URL" \
            --scorer "$RUNNER_TEMP/housedeals-score"
