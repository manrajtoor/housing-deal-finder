# housedeals dashboard (Cloudflare Pages): static files in public/ plus one
# Pages Function (functions/api/[[path]].js) that forwards read-only API
# calls to the Worker over a service binding. The page and its API are then
# one origin, so one Cloudflare Access application protects both, and the
# browser never needs CORS or a second Access login.
#
# Nothing here is deployed until you run `npx wrangler pages deploy` yourself.

name = "housedeals"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# The Worker from ../worker (its `name`). Deploy the Worker first.
[[services]]
binding = "API"
service = "housedeals-api"

# Cloudflare Access app in front of this site (Zero Trust > Access > Applications).
# /api/* verifies the Access login token against these, so a per-deployment
# <hash>.pages.dev address that Access does not cover still serves no data.
# The audience tag is on the app's Overview page ("Application Audience (AUD) Tag").
# TODO: fill ACCESS_AUD after creating the Access app; until then /api/* answers 503.
[vars]
ACCESS_TEAM_DOMAIN = "https://divine-lab-4dde.cloudflareaccess.com"
ACCESS_AUD = ""
