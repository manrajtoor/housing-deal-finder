[package]
name = "housedeals-worker"
version = "0.1.0"
edition = "2021"
description = "Cloudflare Worker housedeals-api: ingest listings into D1, score touched groups, serve deals"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
housedeals-scorer = { path = "../../scorer" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# The Workers runtime bindings are only needed (and only built) for wasm32.
# Everything else is tested natively with `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1"] }

# Native tests run the real migrations and SQL on an in-memory SQLite.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
